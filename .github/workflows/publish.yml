name: Publish Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartLock.sln

      - name: Test
        run: dotnet test SmartLock.sln --configuration Release --no-restore --verbosity normal

      - name: Publish win-x64
        run: dotnet publish src\SmartLock.App\SmartLock.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o artifacts\SmartLock-win-x64

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path artifacts\SmartLock-win-x64\* -DestinationPath SmartLock-Windows-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLock-Windows-win-x64
          path: SmartLock-Windows-win-x64.zip
